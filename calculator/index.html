<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="calculator">
        <h1>Mathematical Calculator</h1>

        <input type="number" id="num1"
        placeholder="Enter the first number"><br><br>

        <select name="#" id="select">
            <option value="">Operator</option>
            <option value="+">+</option>
            <option value="-">-</option>
            <option value="*">*</option>
            <option value="/">/</option>
        </select><br><br><br>

        <input type="number" id="num2"
        placeholder="Enter the Second number"><br><br>

        <button onclick="calculator()" id="calculate">Calculate</button>

        <h2 id="result">Result:</h2>

        <button onclick="clear()" id="calculate">Clear</button>
        
    </div>
    
    <script src="style.js"></script>
</body>
</html>
